name: Android debug APK

# Builds the game as a debug APK: a full-screen WebView around the web files at the repository root (see android/).
# The APK is attached to the run as an artifact. Install it on a phone with `adb install` or by opening the file.
# A debug build opens the game with ?debug (frame rate, draw calls and memory overlay) and allows chrome://inspect.

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['index.html', 'css/**', 'js/**', 'vendor/**', 'android/**', '.github/workflows/android-debug.yml']
  pull_request:
    paths: ['index.html', 'css/**', 'js/**', 'vendor/**', 'android/**', '.github/workflows/android-debug.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK (platform 34 and build tools); this installs Gradle itself, so no wrapper is committed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
