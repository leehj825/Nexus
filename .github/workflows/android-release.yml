name: Android release (APK and AAB)

# Builds the signed release APK and the Play bundle (AAB) when a change is merged to main. The upload key comes from repository
# secrets: KEYSTORE_B64 (the keystore, base64), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Both files are attached to the run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Check the keystore, alias and password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 \
            || { echo "::error::KEY_ALIAS is not an alias in the keystore, or KEYSTORE_PASSWORD is wrong. Locally run: keytool -list -keystore upload.jks"; exit 1; }

      - name: Build the release APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
