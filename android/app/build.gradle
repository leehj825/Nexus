plugins {
    id 'com.android.application'
}

// The upload key comes from the environment (set by the release workflow from repository secrets); local builds without it stay unsigned
def keystorePath = System.getenv('KEYSTORE_PATH')

android {
    namespace 'io.github.leehj825.nexus'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.leehj825.nexus'
        minSdk 26
        targetSdk 34
        versionCode ((System.getenv('VERSION_CODE') ?: '1') as int)     // the release workflow sets this from the run number
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // Release: not debuggable, so no WebView inspection and no ?debug overlay (BuildConfig.DEBUG is false)
        release {
            debuggable false
            signingConfig keystorePath ? signingConfigs.release : null
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game is the plain web files at the repository root. They are copied (not duplicated in git) into
    // the app's assets under www/ before every build, and served to the WebView from a https:// origin.
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/www'))
    }
}

def webRoot = rootProject.projectDir.parentFile
tasks.register('copyWeb', Copy) {
    from(webRoot) {
        include 'index.html', 'css/**', 'js/**', 'vendor/**'
    }
    into layout.buildDirectory.dir('generated/www/www')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyWeb' }
